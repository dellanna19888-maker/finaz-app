<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compliance Console · D-C-G</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="compliance.js"></script>
  </head>
  <body class="console">
    <header class="topbar">
      <div class="brand">🛡️&nbsp;Compliance&nbsp;Console</div>
      <nav class="toolbar">
        <a class="navlink" href="/">← Markdown-Editor</a>
      </nav>
    </header>

    <main class="console-main">
      <section class="card">
        <h2>Prüfung (Simulation)</h2>
        <p class="hint">
          Prüft eine Operation durch das Gateway – ohne Claude-Aufruf, ohne
          API-Key. Schreibt nichts ins Audit-Log.
        </p>
        <textarea id="c-text" placeholder="Inhalt / Dokument hier einfügen ..."></textarea>
        <div class="controls">
          <label>
            Aktion
            <select id="c-action">
              <option value="generate">Generieren</option>
              <option value="improve" selected>Verbessern</option>
              <option value="continue">Fortsetzen</option>
              <option value="summarize">Zusammenfassen</option>
              <option value="translate">Übersetzen</option>
            </select>
          </label>
          <label>
            Gerichtsbarkeit
            <select id="c-jur">
              <option value="">Auto (GEO/Fallback)</option>
              <option value="EU">EU (DSGVO / AI Act)</option>
              <option value="UK">UK (UK GDPR)</option>
              <option value="US">US (NIST / CCPA)</option>
              <option value="DEFAULT">DEFAULT (restriktiv)</option>
            </select>
          </label>
          <label class="check">
            <input type="checkbox" id="c-consent" /> Menschliche Autorisierung
          </label>
          <button id="c-run" class="primary">Prüfen</button>
        </div>
        <div id="c-result" class="result hidden"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Audit-Log</h2>
          <div class="spacer"></div>
          <button id="c-refresh" class="ghost">Aktualisieren</button>
          <button id="c-csv" class="ghost">CSV exportieren</button>
        </div>
        <div class="table-wrap">
          <table id="c-table">
            <thead>
              <tr>
                <th>Zeit</th>
                <th>Gerichtsbarkeit</th>
                <th>Aktion</th>
                <th>Status</th>
                <th>Referenz</th>
                <th>Entscheidung</th>
              </tr>
            </thead>
            <tbody id="c-tbody"></tbody>
          </table>
        </div>
        <p id="c-empty" class="hint">Noch keine Einträge.</p>
      </section>
    </main>
  </body>
</html>
