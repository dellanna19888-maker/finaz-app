# Render-Blueprint: ein Web-Service, der Frontend + API/Compliance ausliefert.
# Nutzung: in Render "New +" → "Blueprint" → dieses Repo wählen.
# Danach die Env-Var ANTHROPIC_API_KEY als Secret im Dashboard setzen.
services:
  - type: web
    name: finaz-app
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLAUDE_MODEL
        value: claude-opus-4-8
      # Secret – im Render-Dashboard eintragen, NICHT hier hardcoden:
      - key: ANTHROPIC_API_KEY
        sync: false
